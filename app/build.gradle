plugins {
    id 'com.android.application'
}

android {
    namespace 'com.portfinder.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yziohp.portperson'
        minSdk 28          // Android 9+ (large USB bulk transfers)
        targetSdk 35
        versionCode 4      // internal build number; only ever goes up
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so "assembleRelease" gives an installable APK for personal use.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No runtime libraries: the app uses only the Android framework.
    testImplementation 'junit:junit:4.13.2'
}
